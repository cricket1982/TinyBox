name: Build APK

# Builds a signed APK and attaches it to the GitHub Release.
# Trigger: publish a Release on github.com (Releases -> Draft a new release),
# or run it by hand from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_B64 is missing - see GITHUB_SETUP.md step 3"; exit 1
          fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.event.release.tag_name }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          NAME="TinyBox-${VERSION_NAME:-build-${GITHUB_RUN_NUMBER}}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Attach APK to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}

      - name: Keep APK as a downloadable artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: TinyBox-apk
          path: ${{ env.APK_NAME }}
